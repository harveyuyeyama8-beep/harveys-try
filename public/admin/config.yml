# Sveltia CMS — the admin panel at /admin
#
# Field names here must match the zod schema in src/content.config.ts. If they
# drift apart, the CMS will happily save something the build then rejects, so
# change both together.

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/harveys-try   # ← change this
  branch: main
  base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev   # ← your OAuth worker

# Where uploaded images land in the repo, and how the site refers to them.
media_folder: public/images
public_folder: /images

# Edits go straight to main and trigger a rebuild. Switch to editorial_workflow
# if you'd rather stage changes as pull requests.
publish_mode: simple

collections:
  - name: advertorials
    label: Advertorials
    label_singular: Advertorial
    folder: src/content/advertorials
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{headline}}'
    fields:
      - { label: 'Internal title (also the browser tab)', name: title, widget: string }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: 'Draft pages are not built at all.' }
      - { label: 'Primary — ads land here', name: primary, widget: boolean, default: false, hint: 'The one page served at the root URL. Only one should be on.' }

      - { label: 'Meta description', name: description, widget: text, hint: 'About 155 characters. This is the link preview text.' }
      - { label: 'Social share image', name: ogImage, widget: image, required: false, default: /og.jpg }
      - { label: 'Hide from search engines', name: noindex, widget: boolean, default: true, hint: 'Leave on. A paid landing page competing with your store in search hurts you.' }

      - { label: 'Page shell', name: format, widget: select, options: [article, story, news], default: article, hint: 'article = the long-read with a byline. story = the "4 myths" listicle: offer strip, dark masthead with a button, headline over a hero image, alternating bands. news = a news feature: section-name masthead (no brand), red kicker, captioned hero photo, date line, one column, news footer with the ad disclosure.' }
      - { label: 'Offer strip (story only)', name: offerStrip, widget: string, required: false, hint: 'The line in the yellow strip above the masthead.' }
      - { label: 'Hero image (story + news)', name: heroImage, widget: image, required: false }
      - { label: 'Hero image alt text', name: heroAlt, widget: string, required: false }
      - { label: 'Hero caption (news only)', name: heroCaption, widget: string, required: false, hint: 'One plain sentence: who is in the photo and what they are doing.' }
      - { label: 'Hero photo credit (news only)', name: heroCredit, widget: string, required: false, hint: 'The real photographer, or "Courtesy of …". Leave empty if unknown.' }
      - { label: 'Masthead section name (news only)', name: section, widget: string, required: false, hint: 'e.g. "Food & Drink". Never a real publication name, never the brand.' }
      - { label: 'Ad label by the date line (news only)', name: label, widget: string, required: false, default: '', hint: 'e.g. "Advertisement". Empty = no label at the top; the footer disclosure shows either way.' }

      - { label: Kicker, name: kicker, widget: string, required: false }
      - { label: Headline, name: headline, widget: text }
      - { label: Subhead, name: dek, widget: text, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, required: false }
      - { label: 'Reading time', name: readingTime, widget: string, required: false }

      - label: 'Call to action'
        name: cta
        widget: object
        hint: 'The default for every CTA block. A single block may override the offer line, but never the button.'
        fields:
          - { label: 'Offer line', name: offer, widget: text }
          - { label: 'Urgency line', name: urgency, widget: text, required: false }
          - { label: 'Button text', name: button, widget: string, default: 'TAKE THE QUIZ' }
          - { label: 'Line under the button', name: sub, widget: string, required: false }
          - { label: 'Guarantee line', name: risk, widget: string, required: false, default: '', hint: 'Leave empty and no guarantee shows. Only fill this in once the refund policy says the same thing.' }
          - label: Bullets
            name: bullets
            widget: list
            field: { label: Bullet, name: bullet, widget: string }
          - { label: Destination, name: destination, widget: select, options: [quiz, shop], default: quiz, hint: 'Named destination resolved at the edge. Add new ones in functions/_lib/destinations.js.' }

      - label: 'Sticky mobile bar'
        name: sticky
        widget: object
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: sub, widget: string, required: false }

      # ------------------------------------------------------------------
      # The page itself. Add, remove and drag blocks into any order.
      # ------------------------------------------------------------------
      - label: Page blocks
        name: blocks
        widget: list
        types:
          - label: Prose
            name: prose
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: 'Drop cap on first paragraph', name: lead, widget: boolean, default: false }
              - { label: Body, name: body, widget: markdown }

          - label: Photo
            name: photo
            widget: object
            fields:
              - { label: Image, name: src, widget: image, required: false }
              - { label: 'Alt text', name: alt, widget: string, required: false }
              - { label: Caption, name: caption, widget: string, required: false }
              - { label: Shape, name: shape, widget: select, options: [wide, standard, tall], default: standard }
              - { label: Width, name: width, widget: select, options: [full, inset], default: full }
              - { label: 'Placeholder note', name: note, widget: string, required: false, hint: 'What to shoot. Shown only while no image is set.' }
              - { label: 'Photo credit', name: credit, widget: string, required: false, hint: 'Shown after the caption. The real photographer, or "Courtesy of …".' }

          - label: 'Trust bar'
            name: trustbar
            widget: object
            fields:
              - { label: Label, name: label, widget: string, required: false, default: 'As Seen In', hint: 'Sits between two rules above the logos. Leave empty to hide.' }
              - label: Logos
                name: logos
                widget: list
                required: false
                field: { label: Outlet, name: logo, widget: select, options: [toi, sacbee, abc10, aol, yahoo, comstocks, enterprise, dirt] }
                hint: 'Pick from the outlets in src/press.ts. Outlets without a logo file show their name in type.'
              - { label: 'Headline', name: heading, widget: string, required: false, hint: 'The bold line under the logos.' }
              - { label: 'Proof line', name: proof, widget: string, required: false, hint: 'The quieter line under the headline. Any figure here needs a source.' }
              - { label: Stars, name: stars, widget: number, default: 0, value_type: int, min: 0, max: 5, hint: '0 hides the stars.' }

          - label: 'Call to action'
            name: cta
            widget: object
            fields:
              - { label: Variant, name: variant, widget: select, options: [standard, final], default: standard }
              - { label: 'Offer line (override)', name: offer, widget: text, required: false, hint: 'Leave empty to use the page-wide offer. Set it only to lead this one placement with a different deal — the button never changes.' }
              - { label: 'Closing line', name: note, widget: string, required: false, hint: 'Shown under the button, this placement only. **bold** works.' }

          - label: 'Numbered myth / reason'
            name: reason
            widget: object
            fields:
              - { label: Number, name: number, widget: number, value_type: int, min: 1 }
              - { label: Heading, name: heading, widget: string, hint: 'e.g. "MYTH: Store-Bought Coffee Is Fresh". The number is added in front automatically.' }
              - { label: 'Bold lead line', name: lead, widget: string, required: false }
              - { label: Body, name: body, widget: markdown }
              - { label: Image, name: image, widget: image, hint: 'Portrait, about 4:5. Rows alternate image-left, image-right on their own.' }
              - { label: 'Image alt text', name: alt, widget: string, required: false }

          - label: 'Offer card'
            name: offercard
            widget: object
            fields:
              - { label: 'Product image', name: image, widget: image }
              - { label: 'Image alt text', name: alt, widget: string, required: false }
              - { label: Badge, name: badge, widget: string, required: false, hint: 'The starburst on the image, e.g. "FREE BAG". Two short words at most.' }
              - { label: Heading, name: heading, widget: string }
              - { label: 'Bold line under the heading', name: subheading, widget: string, required: false }
              - { label: Body, name: body, widget: markdown }
              - { label: 'Small print under the button', name: fine, widget: string, required: false }

          - label: 'Benefit cards'
            name: benefits
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Cards
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: 'Pull quote'
            name: pullquote
            widget: object
            fields:
              - { label: Text, name: text, widget: text, hint: 'No quote marks — they are added when a source is set.' }
              - { label: 'Said by, and where', name: cite, widget: string, required: false, hint: 'e.g. "Harvey Uyeyama, to The Sacramento Bee". The quote must be verbatim from that source.' }

          - label: 'More coverage'
            name: coverage
            widget: object
            fields:
              - { label: Label, name: label, widget: string, default: 'More coverage' }
              - label: Articles
                name: items
                widget: list
                hint: 'Only articles that actually ran. Copy the headline exactly.'
                fields:
                  - { label: Outlet, name: outlet, widget: string }
                  - { label: Logo, name: logo, widget: select, required: false, options: [toi, sacbee, abc10, aol, yahoo, comstocks, enterprise, dirt] }
                  - { label: 'Headline (verbatim)', name: headline, widget: string }
                  - { label: Date, name: date, widget: string, required: false, hint: 'e.g. "July 1, 2026"' }
                  - { label: URL, name: url, widget: string, pattern: ['^https?://\S+$', 'Paste the full link, starting with https://'] }

          - label: 'Fact box'
            name: factbox
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Figures
                name: items
                widget: list
                fields:
                  - { label: Figure, name: figure, widget: string, hint: 'e.g. "$34"' }
                  - { label: Label, name: label, widget: string }
              - { label: Footnote, name: note, widget: string, required: false, hint: 'What the math assumes, or the source. **bold** works.' }

          - label: 'Comparison table'
            name: compare
            widget: object
            fields:
              - { label: Label, name: label, widget: string, required: false }
              - { label: 'Their column heading', name: themHeading, widget: string, default: 'Supermarket bag' }
              - { label: 'Your column heading', name: usHeading, widget: string, default: "Harvey's subscription" }
              - label: Rows
                name: rows
                widget: list
                fields:
                  - { label: Row label, name: label, widget: string }
                  - { label: Them, name: them, widget: string }
                  - { label: Us, name: us, widget: string }

          - label: Steps
            name: steps
            widget: object
            fields:
              - label: Steps
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }

          - label: 'Quiz preview card'
            name: quizcard
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, default: 'What the quiz asks' }
              - { label: 'Time line', name: time, widget: string, default: '5 questions · about 60 seconds' }
              - label: Questions
                name: questions
                widget: list
                field: { label: Question, name: question, widget: string }
              - { label: Footnote, name: footnote, widget: string, required: false }

          - label: 'Press strip'
            name: press
            widget: object
            fields:
              - { label: Label, name: label, widget: string, default: 'As covered by' }
              - label: Outlets
                name: items
                widget: list
                fields:
                  - { label: Outlet, name: outlet, widget: string }
                  - { label: Logo, name: logo, widget: select, required: false, options: [toi, sacbee, abc10, aol, yahoo, comstocks, enterprise, dirt], hint: 'Leave empty to show the outlet name as text instead.' }
                  - { label: Quote, name: quote, widget: text, hint: 'Paste the actual sentence from the article. Never paraphrase or invent.' }
                  - { label: URL, name: url, widget: string, pattern: ['^https?://\S+$', 'Paste the full link, starting with https://'] }
                  - { label: 'Link text', name: linkText, widget: string, default: 'Read the article →' }

          - label: Reviews
            name: reviews
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Reviews
                name: items
                widget: list
                required: false
                hint: 'Real reviews only, with permission. Leave empty and nothing renders.'
                fields:
                  - { label: Stars, name: stars, widget: number, default: 5, value_type: int, min: 1, max: 5 }
                  - { label: Quote, name: quote, widget: text }
                  - { label: Who, name: who, widget: string }

          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, default: Questions }
              - label: Questions
                name: items
                widget: list
                fields:
                  - { label: Question, name: q, widget: string }
                  - { label: Answer, name: a, widget: markdown }
