  <!--
    Sveltia CMS. It reads ./config.yml, authenticates you against GitHub
    through the OAuth worker named in that file, and commits your edits
    straight to the repo. Cloudflare Pages sees the commit and rebuilds.

    Pin the version once you're happy with it, e.g.
      https://unpkg.com/@sveltia/cms@<version>/dist/sveltia-cms.js
    so an upstream release can never change your admin panel overnight.

    If this ever fails to load, check the current script tag in the Sveltia
    README — it is the one line here that lives outside your control.
    jsDelivr mirror: https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js
  -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
